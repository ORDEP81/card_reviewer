[project]
name = "card-reviewer"
version = "0.1.0"
description = "Sports card grading knowledge pipeline and review engine"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "typer>=0.27",
    "rich>=14",
    "pyyaml>=6",
    "imagehash>=4.3",
    "pillow>=11",
    "mlx-whisper>=0.4.3",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "anthropic>=0.40",
]

[project.scripts]
card-knowledge = "card_reviewer.knowledge.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_reviewer"]

[tool.hatch.build.targets.wheel.force-include]
"src/card_reviewer/review/storage/schema.sql" = "card_reviewer/review/storage/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
