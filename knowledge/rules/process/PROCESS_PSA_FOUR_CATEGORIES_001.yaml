  - 00:26-00:47
  quote: PSA's expert graders primarily focus on four things when assessing a card.
    How centered is the image within the card's borders? Are the corners sharp or
    do they show frame bending or other signs of wear? Are there visible surface imperfections
    like scratches, creases, or other flaws that might be difficult to see with the
    naked eye? Are the edges smooth and crisp? Or do they have chipping, tears, or
    other imperfections?
