id: CENTERING_60_40_FLOOR_001
category: centering
statement: 60/40 front centering is a practical floor; at that ratio the card must
  be flawless in every other category to have a chance at a 10.
evidence_type: opinion
confidence: medium
applies_to:
  card_types: []
  sets: []
